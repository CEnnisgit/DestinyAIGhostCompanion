# Render blueprint for the Ghost Companion backend (Rust + Postgres/pgvector).
# Create with: Render dashboard → New → Blueprint → pick this repo.
# Secrets marked `sync: false` must be set in the dashboard before first deploy.
services:
  - type: web
    name: ghost-companion-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    # NOT `free`: the free tier spins down after inactivity, which drops the
    # `/ws/voice` WebSocket and re-runs the manifest sync on every cold start.
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ghost-companion-db
          property: connectionString
      # --- Security: MUST be set, or the server accepts `membership_id` as a
      # plain query param and any caller can impersonate any Guardian. ---
      - key: GHOST_REQUIRE_AUTH
        value: "1"
      # Render generates a strong random secret on first deploy and keeps it
      # stable across deploys. Rotating it invalidates every issued session.
      - key: GHOST_SESSION_SECRET
        generateValue: true
      # Bungie application (https://www.bungie.net/en/Application)
      - key: BUNGIE_API_KEY
        sync: false
      - key: BUNGIE_CLIENT_ID
        sync: false
      - key: BUNGIE_CLIENT_SECRET
        sync: false
      # Native-app OAuth: redirect the callback to the iOS URL scheme.
      - key: GHOST_MOBILE_CALLBACK
        value: ghostcompanion://auth
      # Generative AI (OpenAI-compatible; ADR-007). Set the key as a secret.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      # --- Cost control: `/chat` and `/ws/voice` spend paid inference per turn.
      # These cap turns per Guardian (sustained rate + burst). ---
      - key: GHOST_CHAT_RATE_PER_MINUTE
        value: "15"
      - key: GHOST_CHAT_RATE_BURST
        value: "5"
      # Download + embed the Destiny manifest on boot (needs a real Bungie key).
      # Leave at "0" for the first deploy: embedding the full manifest costs real
      # money at the embeddings API and takes a while. Flip to "1" once the
      # service is up and you've confirmed /health.
      - key: GHOST_MANIFEST_SYNC
        value: "0"

databases:
  - name: ghost-companion-db
    # Render Postgres supports the pgvector extension (migration 002).
    plan: basic-256mb
    postgresMajorVersion: "16"
