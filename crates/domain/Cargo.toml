[package]
name = "domain"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1.89"
anyhow = "1.0.102"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
