name: GhostCompanion
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  GhostCompanion:
    type: application
    platform: iOS
    sources:
      - GhostCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cennis.ghostcompanion
        PRODUCT_NAME: GhostCompanion
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        INFOPLIST_FILE: GhostCompanion/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Set your Apple Developer Team ID here before archiving for the App Store.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
