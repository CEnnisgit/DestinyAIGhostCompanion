services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ghost_companion_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ghost_companion
      POSTGRES_USER: ghost
      POSTGRES_PASSWORD: ghost_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghost -d ghost_companion"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
