name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'ghost/**'
      - 'server*.py'
      - 'frontend/**'
      - 'requirements*.txt'
      - '*.spec'
      - 'installer/**'
      - 'build_exe.bat'
      - 'launch.py'
      - 'desktop_launch.py'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: /
      - run: python -m pip install -r requirements-desktop.txt pyinstaller
      - run: python -m PyInstaller --clean --noconfirm ghost_desktop.spec
      - name: Build unsigned Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          & $iscc installer/ghost_companion.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unsigned macOS disk image
        if: runner.os == 'macOS'
        run: hdiutil create -volname "Ghost Companion" -srcfolder "dist/Ghost Companion.app" -ov -format UDZO dist/GhostCompanion.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GhostCompanion-${{ runner.os }}-unsigned
          path: |
            dist/installer/*.exe
            dist/*.dmg
          if-no-files-found: error
